name: 20. Ejercicio Entregable

on:
  workflow_dispatch:
    inputs:
      security_tests:
        type: boolean
        description: Ejecutar Tests de Seguridad
        default: true
        required: true

jobs:
  # =========================
  # 1. CI & SEGURIDAD
  # =========================
  ci-seguridad:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    - name: Validar ventas.json
      run: python -m json.tool ventas.json

    # Solo si el usuario ha marcado "si" en el input
    - name: Escaneo de seguridad
      if: ${{ github.event.inputs.security_tests == 'true' }}
      run: python code/python/security_scan.py

  # =========================
  # 2. PROCESAMIENTO
  # =========================
  procesamiento:
    runs-on: ubuntu-latest
    needs: ci-seguridad
    strategy:
      matrix:
        entorno: [staging, production]
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Generar reporte
      run: |
        echo "Reporte de ventas - entorno ${{ matrix.entorno }}" > reporte_${{ matrix.entorno }}.txt
        echo "Fecha: $(date)" >> reporte_${{ matrix.entorno }}.txt
        cat ventas.json >> reporte_${{ matrix.entorno }}.txt

    - name: Subir reporte
      uses: actions/upload-artifact@v4
      with:
        name: reporte-${{ matrix.entorno }}
        path: reporte_${{ matrix.entorno }}.txt

  # =========================
  # 3. NOTIFICACION
  # =========================
  notificacion:
    runs-on: ubuntu-latest
    needs: [ci-seguridad, procesamiento]
    if: ${{ success() }}
    steps:
    - name: Notificar por Discord
      run: echo "Enviando notificacion a ${{ secrets.DISCORD_WEBHOOK }}"
